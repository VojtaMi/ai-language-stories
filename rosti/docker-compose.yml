# Generic standalone example; see rosti/README.md.
services:
  app:
    build:
      context: ..
      dockerfile: rosti/Dockerfile
    image: language-stories:local
    restart: always
    ports:
      - "80:80"
    volumes:
      # Server-side story media and progression evidence (not browser saves).
      - stories:/app/stories
      # The single prepared next story; regenerating one costs a full story.
      - reading-openings:/app/reading-openings
      # Prepared typing openings.
      - openings:/app/openings
      # Word log and learner profile — the adaptation chain's memory.
      - learner:/app/learner
      # Caches. Every entry is a provider call already paid for.
      - word-audio:/app/word-audio
      - story-audio:/app/story-audio
      - story-images:/app/story-images
      - lesson-audio:/app/lesson-audio
    environment:
      # OpenAI is required. Gemini enables optional text/speech models, and
      # Anthropic is needed only when a Claude model is selected.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=80

volumes:
  stories:
  reading-openings:
  openings:
  learner:
  word-audio:
  story-audio:
  story-images:
  lesson-audio:
